version: 2
# Every update targets `development`: feature intake happens there and the
# promotion chain (development -> delivery -> main) carries it forward. A PR
# into `main` from any other head is failed by promotion-guard by design.
updates:
  # Keep each example's dependencies (MonetizeKit SDKs + framework deps) current.
  - package-ecosystem: npm
    directory: "/"
    target-branch: development
    schedule:
      interval: weekly
    groups:
      monetizekit:
        patterns:
          - "@monetizekit/*"
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: development
    schedule:
      interval: weekly
