name: CI

on:
  push:
    branches: [main, delivery, development]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck + build all examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck every example
        run: pnpm typecheck

      - name: Build every example (Node SDK + Next.js)
        run: pnpm build

  # Shadow-mode reviewer from MonetizeKit/.github: one advisory comment per PR,
  # never blocks (the reusable workflow is continue-on-error internally and
  # self-skips without a credential), and is not part of required-checks.
  # Model, tools and route come from the fleet agent-policy.json.
  shadow-review:
    name: Shadow Review (advisory)
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write
    uses: MonetizeKit/.github/.github/workflows/reusable-pr-review.yml@v1
    secrets: inherit

  required-checks:
    name: Required Checks Gate
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - build
    steps:
      - name: Validate required checks passed
        shell: bash
        run: |
          status="${{ needs.build.result }}"
          if [ "${status}" != "success" ]; then
            echo "Required check failed: build => ${status}"
            exit 1
          fi
          echo "All required checks passed."
